<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRemotePlay Client</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 24px;
    }

    .cards {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .card {
      width: 200px;
      height: 200px;
      background: #222;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.1s;
    }

    .card:hover {
      background: #333;
    }

    .panel {
      display: none;
      background: #222;
      border: 2px solid #444;
      padding: 20px;
      margin-top: 20px;
    }

    .panel.active {
      display: block;
    }

    input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 10px;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      font-family: monospace;
    }

    button {
      background: #eee;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ccc;
    }

    .back-btn {
      background: transparent;
      color: #eee;
      border: 1px solid #444;
      width: auto;
      margin-bottom: 20px;
    }

    .log {
      margin-top: 10px;
      padding: 10px;
      background: #000;
      border: 1px solid #444;
      font-size: 12px;
      min-height: 60px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>OpenRemotePlay</h1>

  <div class="cards" id="landing">
    <div class="card" onclick="showPanel('host')">HOST</div>
    <div class="card" onclick="showPanel('join')">JOIN</div>
  </div>

  <!-- Host Panel -->
  <div class="panel" id="panelHost">
    <button class="back-btn" onclick="showLanding()">Back</button>
    <h2>Host Session</h2>
    <label>Room Code</label>
    <input type="text" id="hostCode">
    <button onclick="startHost()" id="btnStartHost">Start Hosting</button>
    <div class="log" id="hostLog">Ready.</div>
  </div>

  <!-- Join Panel -->
  <div class="panel" id="panelJoin">
    <button class="back-btn" onclick="showLanding()">Back</button>
    <h2>Join Session</h2>
    <label>Room Code</label>
    <input type="text" id="joinCode" placeholder="e.g. 13crybj-197u3n">
    <!-- Signaling URL is handled automatically under the hood -->
    <input type="hidden" id="joinSigUrl" value="ws://localhost:3001/signaling">
    <button onclick="startJoin()" id="btnJoin">Connect</button>
    <div class="log" id="joinLog">Ready.</div>
  </div>
</div>

<script src="../packages/orp-client/dist/orp-client.bundle.js"></script>
<script>
  function showPanel(which) {
    document.getElementById('landing').style.display = 'none';
    document.getElementById('panelHost').classList.remove('active');
    document.getElementById('panelJoin').classList.remove('active');
    document.getElementById('panel' + which.charAt(0).toUpperCase() + which.slice(1)).classList.add('active');
    
    if (which === 'host') {
      // Generate a simple P2P code like Nearcade (peer-xxxx)
      document.getElementById('hostCode').value = 'peer-' + Math.floor(Math.random() * 100000);
    }
  }

  function showLanding() {
    document.getElementById('landing').style.display = 'flex';
    document.getElementById('panelHost').classList.remove('active');
    document.getElementById('panelJoin').classList.remove('active');
  }

  function logHost(msg) { document.getElementById('hostLog').textContent = msg; }
  function logJoin(msg) { document.getElementById('joinLog').textContent = msg; }

  let hostWs = null;
  let orpClient = null;

  function startHost() {
    const code = document.getElementById('hostCode').value;
    const sigUrl = 'ws://localhost:3001/signaling';
    
    logHost('Connecting to signaling server...');
    document.getElementById('btnStartHost').disabled = true;

    if (hostWs) hostWs.close();
    hostWs = new WebSocket(sigUrl);

    hostWs.onopen = () => {
      // Use the P2P code directly as the sessionId
      hostWs.send(JSON.stringify({ type: 'host-announce', sessionId: code }));
      logHost(`Live. Share P2P code: ${code}`);
    };

    hostWs.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'join') {
        logHost(`Viewer joined! DataChannel active.`);
      }
    };

    hostWs.onerror = () => {
      logHost('Error: Could not reach signaling server.');
      document.getElementById('btnStartHost').disabled = false;
    };
  }

  async function startJoin() {
    const code = document.getElementById('joinCode').value.trim();
    const sigUrl = document.getElementById('joinSigUrl').value.trim();

    if (!code) return logJoin('Enter a P2P code.');
    
    logJoin('Connecting...');
    document.getElementById('btnJoin').disabled = true;

    if (orpClient) {
      try { orpClient.disconnect(); } catch(e) {}
    }

    // We pass the raw code as the pin/session identifier
    orpClient = new ORP.ORPClient({ pin: code, displayName: 'Viewer' });

    orpClient.on('timing', (t) => {
      if (t.outcome === 'success') {
        logJoin('Connected successfully. Data channel open.');
      } else if (t.outcome === 'failed') {
        logJoin(`Failed: ${t.failureReason}`);
        document.getElementById('btnJoin').disabled = false;
      }
    });

    orpClient.on('error', (reason, msg) => {
      logJoin(`Error: ${reason} - ${msg}`);
      document.getElementById('btnJoin').disabled = false;
    });

    // Connect using the raw code as the sessionId (bypassing any hashing if we just want raw P2P codes)
    await orpClient.connect(sigUrl + '#' + code).catch(() => {
      document.getElementById('btnJoin').disabled = false;
    });
  }

  // Handle web+orp:// auto-fill
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const target = new URLSearchParams(location.search).get('target');
      if (target) {
        const url = new URL(target.replace(/^web\+orp:\/\//, 'http://'));
        document.getElementById('joinSigUrl').value = `ws://${url.host}/signaling`;
        const code = url.searchParams.get('code') || url.searchParams.get('pin');
        if (code) {
          document.getElementById('joinCode').value = code;
          showPanel('join');
        }
      }
    } catch (e) {}
  });
</script>
</body>
</html>
